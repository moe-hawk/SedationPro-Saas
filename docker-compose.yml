services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sedationpro
      POSTGRES_PASSWORD: sedationpro
      POSTGRES_DB: sedationpro
    ports:
      - "5432:5432"
    volumes:
      - sedation_pro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedationpro -d sedationpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sedation_pro_pgdata:
