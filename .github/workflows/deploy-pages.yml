name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time — a fresh push supersedes any in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build apps/mobile for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version is pinned via `packageManager` in package.json — leaving the
        # action without a `version:` lets it read from there.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        # SaaS branch adds new workspaces; regenerate and commit pnpm-lock.yaml, then restore --frozen-lockfile.
        run: pnpm install --frozen-lockfile

      - name: Build apps/mobile
        run: pnpm build:mobile
        env:
          GITHUB_PAGES: '1'

      - name: SPA fallback — Pages serves dist/404.html for unknown paths
        run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with GitHub Actions as the source if it's not
          # already enabled. Removes the need to flip the Source dropdown in
          # repo settings by hand.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
