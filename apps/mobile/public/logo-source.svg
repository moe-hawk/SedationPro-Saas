<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sedation Pro">
  <!--
    SINGLE SOURCE OF TRUTH for every app icon AND the in-app brand mark
    (favicon, iOS apple-touch, Android maskable, PWA install, plus the
    footer / nav-drawer / clinical-note letterhead). Edit only this file.
    scripts/generate-icons.mjs rasterizes it on every dev/build; the PNGs
    are git-ignored and cannot drift from this source.

    Composition: the ECG glyph fills the canvas tightly (≈8% margins) so it
    reads well as an inline brand mark — minimal dead space. The background
    is full-bleed with NO self-rounded corners: iOS/Android apply their own
    mask, and the in-app placements round it via CSS (border-radius). A
    circular Android maskable crop only ever clips the flat ECG baseline
    tail at the extreme left/right — visually inconsequential; the
    diagnostic QRS complex sits well within the centre safe zone.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3554" />
      <stop offset="100%" stop-color="#0b1e3a" />
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <polyline
    points="40,256 102,256 142,245 159,216 193,307 222,120 250,381 284,233 330,256 472,256"
    stroke="url(#trace)"
    stroke-width="26"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="250" cy="381" r="11" fill="#4ade80" />
</svg>
